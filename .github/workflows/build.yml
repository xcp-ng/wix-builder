name: Build WiX Toolset

on:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip
  VENDOR_NAME: XCP-ng
  WIX_REPO: xcp-ng/wix
  WIX_REVISION: b8977d6f88e7b68e000bac226a2814f236770570 # v7.0.0
  WIX_VERSION: v7.0.0-xcpng.5

jobs:
  build:
    runs-on: windows-2022
    env:
      RepoOrg: ${{ github.repository_owner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.WIX_REPO }}
          ref: ${{ env.WIX_REVISION }}
          fetch-tags: false
      - name: Checkout patches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wix-builder
      - name: Apply patches
        run: ./wix-builder/Apply-WixPatches.ps1
      - name: Reset version
        run: git tag ${{ env.WIX_VERSION }}
      - name: Build wix
        shell: cmd
        run: ./devbuild.cmd Release
        env:
          RuntimeTestsEnabled: false
      - name: Add SBOM tool
        run: |
          New-Item -Type Directory -Path $Env:RUNNER_TEMP/tools/
          Invoke-WebRequest -Uri https://github.com/microsoft/sbom-tool/releases/download/v4.1.4/sbom-tool-win-x64.exe -OutFile $Env:RUNNER_TEMP\tools\sbom.exe
          if ((Get-FileHash $Env:RUNNER_TEMP\tools\sbom.exe -Algorithm SHA256).Hash -ine "9ba208cbec21c93b6d1ba01f50681a47d9d14d302f59b33e505b220b89aa0363") {
            throw "sbom-tool failed verification"
          }
      - name: Generate SBOM
        run: |
          & "$Env:RUNNER_TEMP/tools/sbom.exe" generate -b build/artifacts/ -bc . -pn wix -ps ${{ env.VENDOR_NAME }} -pv ${{ env.WIX_VERSION }}
          if ($LASTEXITCODE -ne 0) {
            throw "sbom-tool failed with exit code $LASTEXITCODE"
          }
      - name: Save build
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wix
          path: build/artifacts/
    outputs:
      subject-name: artifacts
      subject-digest: sha256:${{steps.upload.outputs.artifact-digest}}

  attest:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{needs.build.outputs.subject-name}}
          subject-digest: ${{needs.build.outputs.subject-digest}}
