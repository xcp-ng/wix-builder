name: Build WiX Toolset

on:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip
  VENDOR_NAME: XCP-ng
  WIX_REPO: xcp-ng/wix
  WIX_REF: v6.0.2-xcpng.0

jobs:
  build:
    name: Build
    runs-on: windows-2022
    env:
      RepoOrg: ${{ github.repository_owner }}
      SignBuild: ${{ github.repository_owner == 'wixtoolset' && startsWith(github.ref, 'refs/tags/v') }}
      WixOfficialBuild: ${{ github.repository_owner == 'wixtoolset' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: ${{ env.WIX_REPO }}
          ref: ${{ env.WIX_REF }}
      - name: Checkout patches
        uses: actions/checkout@v5
        with:
          path: wix-builder
      - name: Apply patches
        run: ./wix-builder/Apply-WixPatches.ps1
      - name: Build wix
        shell: cmd
        run: ./src/build_official.cmd
        env:
          RuntimeTestsEnabled: false
      - name: Generate SBOM
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://github.com/microsoft/sbom-tool/releases/latest/download/sbom-tool-win-x64.exe" -OutFile "$Env:RUNNER_TEMP/sbom-tool.exe"
          & "$Env:RUNNER_TEMP/sbom-tool.exe" generate -b build/artifacts/ -bc . -pn wix -ps ${{ env.VENDOR_NAME }} -pv ${{ env.WIX_REF }}
          if ($LASTEXITCODE -ne 0) {
            throw "sbom-tool failed"
          }
      - name: Save build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: wix
          path: build/artifacts/

  attest:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          name: wix
          path: build/artifacts/
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: build/artifacts/**/*.nupkg
